name: mod-base packaged-e2e

# Reusable packaged E2E callee (docs/BUILD-E2E-DESIGN.md, "Build bundle handoff"). A mod's managed
# mod-base-packaged-e2e.yml calls it for a pull request (pull_request_target), for a push to the
# canonical branch and for a manual dispatch there. It never compiles: the input job authenticates
# the one exact Build this run consumes, and every later job selects that same run again by its
# id, so nothing but sealed artifacts travels between jobs. For a pull request the caller names no
# run and the input job waits, for at most 5400 seconds, for the separate Build run of the same
# head; a standalone caller names the run its select job found (select-build.yml) or `same-run`
# after its rebuild job built in this run (build.yml). Every job starts with the Build controller
# prologue and then runs one `ci` command per step, with its private state in
# $RUNNER_TEMP/mb-state. Candidate code runs only inside `ci worker-run`, as a separate account
# and without any token: the candidate tree is a third checkout that no step of the runner user
# executes. When the caller's selection admitted post-merge reuse (mode `reuse`), input, lane and
# aggregate are skipped and the gate seals the reuse reference instead of a tested record. The two
# steps that must also run after a failure or a cancellation (`ci worker-seal`, `ci
# worker-finish`) depend on a step that follows the prologue, so no kit Python ever runs in a job
# whose prologue did not pass.
on:
  workflow_call:
    inputs:
      kit-sha:
        description: The mod-base commit the caller's guard job bound to this run
        required: true
        type: string
      pr-number:
        description: The pull request whose synthetic merge is tested (empty for a push or a dispatch)
        required: false
        type: string
        default: ""
      mode:
        description: Empty or full to run every lane, reuse when the caller's selection admitted post-merge reuse
        required: false
        type: string
        default: ""
      build-run-id:
        description: The Build run to consume (empty for a pull request, same-run after a rebuild in this run)
        required: false
        type: string
        default: ""

permissions: {}

env:
  MB_KIT_TREE_DIGEST: "sha256:ffb939245a17f9b93cf7e454e31060563f20748fb34d50c8e848d3af8e8d2b43"

jobs:
  input:
    name: Authenticate exact Build
    if: inputs.mode != 'reuse'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      tested-sha: ${{ steps.subject.outputs.tested_sha }}
      plan-sha256: ${{ steps.plan.outputs.plan_sha256 }}
      lanes: ${{ steps.plan.outputs.lanes }}
      build-run-id: ${{ steps.select.outputs.run_id }}
    steps:
      - name: Validate call inputs before any checkout
        shell: bash
        env:
          KIT_SHA: ${{ inputs.kit-sha }}
          PR_NUMBER: ${{ inputs.pr-number }}
          MODE: ${{ inputs.mode }}
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN GH_TOKEN
          fail() { printf 'Invalid call input: %s\n' "$1" >&2; exit 1; }
          [[ "$KIT_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || fail kit-sha
          [[ "$GITHUB_REF" == refs/heads/* ]] || fail "event ref"
          [[ "$MODE" =~ ^(full|reuse)?$ ]] || fail mode
          [[ "$BUILD_RUN_ID" =~ ^([1-9][0-9]{0,17}|same-run)?$ ]] || fail build-run-id
          case "$GITHUB_EVENT_NAME" in
            pull_request_target)
              [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,17}$ ]] || fail pr-number
              [[ "$MODE" != reuse ]] || fail "a pull request never reuses"
              [[ -z "$BUILD_RUN_ID" ]] || fail "a pull request waits for its own Build run" ;;
            push) [[ -z "$PR_NUMBER" ]] || fail pr-number ;;
            workflow_dispatch)
              [[ -z "$PR_NUMBER" ]] || fail pr-number
              [[ "$MODE" != reuse ]] || fail "only a push reuses" ;;
            *) fail event ;;
          esac
      - name: Check out the protected mod head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: mod
          persist-credentials: false
      - name: Check out the pinned mod-base kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: The-Plum-Team/mod-base
          ref: ${{ inputs.kit-sha }}
          path: kit
          persist-credentials: false
      - name: Bind the two-part implementation identity
        shell: bash
        env:
          KIT_SHA: ${{ inputs.kit-sha }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN GH_TOKEN
          fail() { printf 'Implementation identity: %s\n' "$1" >&2; exit 1; }
          [[ "$KIT_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "malformed commit identity"
          [[ "$MB_KIT_TREE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "malformed MB_KIT_TREE_DIGEST literal"
          while IFS= read -r name; do
            [[ "$name" != GIT_* ]] || fail "GIT_* variables must not reach a privileged kit job"
          done < <(compgen -e)
          [[ "$(git -C mod rev-parse HEAD)" == "$GITHUB_SHA" ]] || fail "the mod checkout is not github.sha"
          mod_status="$(git -C mod status --porcelain --untracked-files=all)" ||
            fail "cannot read the mod checkout status"
          [[ -z "$mod_status" ]] || fail "the mod checkout is not clean"
          [[ "$(git -C kit rev-parse HEAD)" == "$KIT_SHA" ]] || fail "the kit checkout is not the verified pin"
          kit_status="$(git -C kit status --porcelain --untracked-files=all)" ||
            fail "cannot read the kit checkout status"
          [[ -z "$kit_status" ]] || fail "the kit checkout is not clean"
          canonical_branch="$(jq -er '.canonical_branch | strings' mod/site/mod-base.json)" ||
            fail "site/mod-base.json names no canonical branch"
          [[ "$canonical_branch" =~ ^[A-Za-z0-9._/-]{1,200}$ && "$canonical_branch" != /* &&
             "$canonical_branch" != *..* && "$canonical_branch" != *//* ]] || fail "malformed canonical branch"
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/mod-base-build.yml@refs/heads/$canonical_branch" ||
             "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/mod-base-packaged-e2e.yml@refs/heads/$canonical_branch" ]] ||
            fail "this job is not called by a managed Build or packaged E2E caller of the canonical branch"
          # >>> kit-digest-v1
          kit_digest_v1() {
            local root="$1" directory offending listing
            for directory in src site requirements; do
              if [[ ! -d "$root/$directory" || -L "$root/$directory" ]]; then
                printf 'kit-digest-v1: %s/ is not a real directory\n' "$directory" >&2
                return 1
              fi
            done
            if ! offending="$(CDPATH='' cd -- "$root" && LC_ALL=C find ./src ./site ./requirements \( -type l \
                -o \( ! -type f ! -type d \) -o \( -type f \( -perm -100 -o -perm -010 -o -perm -001 \) \) \
                -o -name __pycache__ -o -name '*[!A-Za-z0-9._-]*' \) -print -quit)" || [[ -n "$offending" ]]; then
              printf 'kit-digest-v1: refusing %q (symlink, special file, executable, __pycache__ or unsafe name)\n' \
                "$offending" >&2
              return 1
            fi
            if ! listing="$(CDPATH='' cd -- "$root" && LC_ALL=C find ./src ./site ./requirements -type f -print0 \
                | LC_ALL=C sort -z | while IFS= read -r -d '' path; do
                    [[ "$path" =~ ^\./[A-Za-z0-9._/-]+$ ]] || exit 1
                    sha256sum -- "$path" || exit 1
                  done)" || [[ -z "$listing" ]]; then
              printf 'kit-digest-v1: cannot list the kit tree\n' >&2
              return 1
            fi
            printf 'sha256:%s\n' "$(printf '%s\n' "$listing" | sha256sum | cut -d ' ' -f 1)"
          }
          # <<< kit-digest-v1
          actual="$(kit_digest_v1 kit)" || fail "the kit checkout cannot be digested"
          [[ "$actual" == "$MB_KIT_TREE_DIGEST" ]] || fail "the kit tree digest $actual differs from the callee literal"
          printf 'MOD_BASE_KIT_SHA=%s\n' "$KIT_SHA" >> "$GITHUB_ENV"
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the hash-locked imaging dependency
        shell: bash
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN GH_TOKEN
          python3 -m pip install --only-binary=:all: --require-hashes --requirement kit/requirements/pillow.txt
      - name: Authenticate the tested subject
        id: subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN
          env -u PYTHONPATH PYTHONPATH="$GITHUB_WORKSPACE/kit/src" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -P -m mod_base ci subject --repo mod --config mod/site/mod-base.json --state "$RUNNER_TEMP/mb-state" \
            --producer packaged --pr "$PR_NUMBER" --github-output "$GITHUB_OUTPUT"
      - name: Fence the host and prepare the worker accounts
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN GH_TOKEN
          interpreter="$(command -v python3)"
          env -u PYTHONPATH PYTHONPATH="$GITHUB_WORKSPACE/kit/src" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -P -m mod_base ci worker-prepare --repo mod --config mod/site/mod-base.json --state "$RUNNER_TEMP/mb-state" \
            --roles validator --python "$interpreter" \
            --java-home "$JAVA_HOME_17_X64" --java-home "$JAVA_HOME_21_X64" --java-home "$JAVA_HOME_25_X64"
      - name: Derive the protected plan
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN
          env -u PYTHONPATH PYTHONPATH="$GITHUB_WORKSPACE/kit/src" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -P -m mod_base ci plan --repo mod --config mod/site/mod-base.json --state "$RUNNER_TEMP/mb-state" \
            --github-output "$GITHUB_OUTPUT"
      - name: Select the exact Build
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN
          env -u PYTHONPATH PYTHONPATH="$GITHUB_WORKSPACE/kit/src" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -P -m mod_base ci select-build --repo mod --config mod/site/mod-base.json --state "$RUNNER_TEMP/mb-state" \
            --build-run-id "$BUILD_RUN_ID" --wait-seconds 5400 \
            --output "$RUNNER_TEMP/mb-state/build-selection.json" --github-output "$GITHUB_OUTPUT"
      - name: Terminate and lock the worker accounts
        if: ${{ always() && steps.subject.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN GH_TOKEN
          env -u PYTHONPATH PYTHONPATH="$GITHUB_WORKSPACE/kit/src" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -P -m mod_base ci worker-finish --repo mod --config mod/site/mod-base.json --state "$RUNNER_TEMP/mb-state"

  lane:
    name: Run packaged lane ${{ matrix.id }}
    needs: input
    if: inputs.mode != 'reuse'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.input.outputs.lanes) }}
    steps:
      - name: Validate call inputs before any checkout
        shell: bash
        env:
          KIT_SHA: ${{ inputs.kit-sha }}
          PR_NUMBER: ${{ inputs.pr-number }}
          MODE: ${{ inputs.mode }}
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN GH_TOKEN
          fail() { printf 'Invalid call input: %s\n' "$1" >&2; exit 1; }
          [[ "$KIT_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || fail kit-sha
          [[ "$GITHUB_REF" == refs/heads/* ]] || fail "event ref"
          [[ "$MODE" =~ ^(full|reuse)?$ ]] || fail mode
          [[ "$BUILD_RUN_ID" =~ ^([1-9][0-9]{0,17}|same-run)?$ ]] || fail build-run-id
          case "$GITHUB_EVENT_NAME" in
            pull_request_target)
              [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,17}$ ]] || fail pr-number
              [[ "$MODE" != reuse ]] || fail "a pull request never reuses"
              [[ -z "$BUILD_RUN_ID" ]] || fail "a pull request waits for its own Build run" ;;
            push) [[ -z "$PR_NUMBER" ]] || fail pr-number ;;
            workflow_dispatch)
              [[ -z "$PR_NUMBER" ]] || fail pr-number
              [[ "$MODE" != reuse ]] || fail "only a push reuses" ;;
            *) fail event ;;
          esac
      - name: Check out the protected mod head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: mod
          persist-credentials: false
      - name: Check out the pinned mod-base kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: The-Plum-Team/mod-base
          ref: ${{ inputs.kit-sha }}
          path: kit
          persist-credentials: false
      - name: Bind the two-part implementation identity
        shell: bash
        env:
          KIT_SHA: ${{ inputs.kit-sha }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN GH_TOKEN
          fail() { printf 'Implementation identity: %s\n' "$1" >&2; exit 1; }
          [[ "$KIT_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "malformed commit identity"
          [[ "$MB_KIT_TREE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "malformed MB_KIT_TREE_DIGEST literal"
          while IFS= read -r name; do
            [[ "$name" != GIT_* ]] || fail "GIT_* variables must not reach a privileged kit job"
          done < <(compgen -e)
          [[ "$(git -C mod rev-parse HEAD)" == "$GITHUB_SHA" ]] || fail "the mod checkout is not github.sha"
          mod_status="$(git -C mod status --porcelain --untracked-files=all)" ||
            fail "cannot read the mod checkout status"
          [[ -z "$mod_status" ]] || fail "the mod checkout is not clean"
          [[ "$(git -C kit rev-parse HEAD)" == "$KIT_SHA" ]] || fail "the kit checkout is not the verified pin"
          kit_status="$(git -C kit status --porcelain --untracked-files=all)" ||
            fail "cannot read the kit checkout status"
          [[ -z "$kit_status" ]] || fail "the kit checkout is not clean"
          canonical_branch="$(jq -er '.canonical_branch | strings' mod/site/mod-base.json)" ||
            fail "site/mod-base.json names no canonical branch"
          [[ "$canonical_branch" =~ ^[A-Za-z0-9._/-]{1,200}$ && "$canonical_branch" != /* &&
             "$canonical_branch" != *..* && "$canonical_branch" != *//* ]] || fail "malformed canonical branch"
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/mod-base-build.yml@refs/heads/$canonical_branch" ||
             "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/mod-base-packaged-e2e.yml@refs/heads/$canonical_branch" ]] ||
            fail "this job is not called by a managed Build or packaged E2E caller of the canonical branch"
          # >>> kit-digest-v1
          kit_digest_v1() {
            local root="$1" directory offending listing
            for directory in src site requirements; do
              if [[ ! -d "$root/$directory" || -L "$root/$directory" ]]; then
                printf 'kit-digest-v1: %s/ is not a real directory\n' "$directory" >&2
                return 1
              fi
            done
            if ! offending="$(CDPATH='' cd -- "$root" && LC_ALL=C find ./src ./site ./requirements \( -type l \
                -o \( ! -type f ! -type d \) -o \( -type f \( -perm -100 -o -perm -010 -o -perm -001 \) \) \
                -o -name __pycache__ -o -name '*[!A-Za-z0-9._-]*' \) -print -quit)" || [[ -n "$offending" ]]; then
              printf 'kit-digest-v1: refusing %q (symlink, special file, executable, __pycache__ or unsafe name)\n' \
                "$offending" >&2
              return 1
            fi
            if ! listing="$(CDPATH='' cd -- "$root" && LC_ALL=C find ./src ./site ./requirements -type f -print0 \
                | LC_ALL=C sort -z | while IFS= read -r -d '' path; do
                    [[ "$path" =~ ^\./[A-Za-z0-9._/-]+$ ]] || exit 1
                    sha256sum -- "$path" || exit 1
                  done)" || [[ -z "$listing" ]]; then
              printf 'kit-digest-v1: cannot list the kit tree\n' >&2
              return 1
            fi
            printf 'sha256:%s\n' "$(printf '%s\n' "$listing" | sha256sum | cut -d ' ' -f 1)"
          }
          # <<< kit-digest-v1
          actual="$(kit_digest_v1 kit)" || fail "the kit checkout cannot be digested"
          [[ "$actual" == "$MB_KIT_TREE_DIGEST" ]] || fail "the kit tree digest $actual differs from the callee literal"
          printf 'MOD_BASE_KIT_SHA=%s\n' "$KIT_SHA" >> "$GITHUB_ENV"
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the hash-locked imaging dependency
        shell: bash
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN GH_TOKEN
          python3 -m pip install --only-binary=:all: --require-hashes --requirement kit/requirements/pillow.txt
      - name: Check out the tested candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.input.outputs.tested-sha }}
          path: candidate
          persist-credentials: false
      - name: Authenticate the tested subject
        id: subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN
          env -u PYTHONPATH PYTHONPATH="$GITHUB_WORKSPACE/kit/src" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -P -m mod_base ci subject --repo mod --config mod/site/mod-base.json --state "$RUNNER_TEMP/mb-state" \
            --producer packaged --pr "$PR_NUMBER" --github-output "$GITHUB_OUTPUT"
      - name: Fence the host and prepare the worker accounts
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN GH_TOKEN
          interpreter="$(command -v python3)"
          env -u PYTHONPATH PYTHONPATH="$GITHUB_WORKSPACE/kit/src" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -P -m mod_base ci worker-prepare --repo mod --config mod/site/mod-base.json --state "$RUNNER_TEMP/mb-state" \
            --roles candidate+validator --python "$interpreter" \
            --java-home "$JAVA_HOME_17_X64" --java-home "$JAVA_HOME_21_X64" --java-home "$JAVA_HOME_25_X64"
      - name: Rederive the protected plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_SHA256: ${{ needs.input.outputs.plan-sha256 }}
          TESTED_SHA: ${{ needs.input.outputs.tested-sha }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN
          fail() { printf 'Protected plan: %s\n' "$1" >&2; exit 1; }
          [[ "$PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail "malformed planned digest"
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "malformed tested commit"
          [[ "$(git -C candidate rev-parse HEAD)" == "$TESTED_SHA" ]] ||
            fail "the candidate checkout is not the planned tested commit"
          env -u PYTHONPATH PYTHONPATH="$GITHUB_WORKSPACE/kit/src" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -P -m mod_base ci plan --repo mod --config mod/site/mod-base.json --state "$RUNNER_TEMP/mb-state" \
            --candidate candidate --expect-sha256 "$PLAN_SHA256" --github-output "$GITHUB_OUTPUT"
      - name: Reselect the exact Build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_RUN_ID: ${{ needs.input.outputs.build-run-id }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN
          fail() { printf 'Build selection: %s\n' "$1" >&2; exit 1; }
          [[ "$SELECTED_RUN_ID" =~ ^[1-9][0-9]{0,17}$ ]] || fail "malformed Build run"
          env -u PYTHONPATH PYTHONPATH="$GITHUB_WORKSPACE/kit/src" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -P -m mod_base ci select-build --repo mod --config mod/site/mod-base.json --state "$RUNNER_TEMP/mb-state" \
            --build-run-id "$SELECTED_RUN_ID" --output "$RUNNER_TEMP/mb-state/build-selection.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Fetch the sealed Build bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN
          env -u PYTHONPATH PYTHONPATH="$GITHUB_WORKSPACE/kit/src" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -P -m mod_base ci fetch-build --repo mod --config mod/site/mod-base.json --state "$RUNNER_TEMP/mb-state" \
            --selection "$RUNNER_TEMP/mb-state/build-selection.json"
      - name: Stage the candidate and the sealed Build bundle
        shell: bash
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN GH_TOKEN
          env -u PYTHONPATH PYTHONPATH="$GITHUB_WORKSPACE/kit/src" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -P -m mod_base ci worker-stage --repo mod --config mod/site/mod-base.json --state "$RUNNER_TEMP/mb-state" \
            --candidate candidate --bundle
