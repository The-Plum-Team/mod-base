name: mod-base select-build

# Reusable selection callee (docs/BUILD-E2E-DESIGN.md, "For a standalone E2E dispatch"). The select
# job of a mod's managed mod-base-packaged-e2e.yml calls it for a push to the canonical branch and
# for a manual dispatch there, never for a pull request: a pull request waits for its own separate
# Build run inside packaged-e2e.yml. Its one job starts with the Build controller prologue,
# authenticates the protected subject, derives the plan and decides what the run consumes. On a
# push whose evidence `ci reuse-admit` admits, that is the result its pull request was tested
# with: the mode is `reuse` and no Build is selected. Otherwise the mode is `full` and `ci
# select-build` looks, without waiting, for the exact existing Build of this subject: found is
# `true` with the run of that Build, or `false`, and then the caller builds in the same run
# before it calls packaged-e2e.yml. The job runs no candidate code and uploads nothing: its
# selection record stays in its private state, and packaged-e2e.yml selects the same run again by
# its id.
on:
  workflow_call:
    inputs:
      kit-sha:
        description: The mod-base commit the caller's guard job bound to this run
        required: true
        type: string
    outputs:
      mode:
        description: reuse when the push reuses the result its pull request was tested with, otherwise full
        value: ${{ jobs.select.outputs.mode }}
      found:
        description: In full mode, true when the exact Build of this subject exists and false when not (else empty)
        value: ${{ jobs.select.outputs.found }}
      build-run-id:
        description: The run of the selected Build (empty when none was found or none was looked for)
        value: ${{ jobs.select.outputs.build-run-id }}

permissions: {}

env:
  MB_KIT_TREE_DIGEST: "sha256:d9c0c0b15a6ba8741b3d2765d763515f30c194e7a79ce2464478c467c6ba3274"

jobs:
  select:
    name: Select exact Build source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.reuse.outputs.mode == 'reuse' && 'reuse' || 'full' }}
      found: ${{ steps.select.outputs.found }}
      build-run-id: ${{ steps.select.outputs.run_id }}
    steps:
      - name: Validate call inputs before any checkout
        shell: bash
        env:
          KIT_SHA: ${{ inputs.kit-sha }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN GH_TOKEN
          fail() { printf 'Invalid call input: %s\n' "$1" >&2; exit 1; }
          [[ "$KIT_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || fail kit-sha
          [[ "$GITHUB_REF" == refs/heads/* ]] || fail "event ref"
          case "$GITHUB_EVENT_NAME" in
            push | workflow_dispatch) ;;
            *) fail event ;;
          esac
      - name: Check out the protected mod head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: mod
          persist-credentials: false
      - name: Check out the pinned mod-base kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: The-Plum-Team/mod-base
          ref: ${{ inputs.kit-sha }}
          path: kit
          persist-credentials: false
      - name: Bind the two-part implementation identity
        shell: bash
        env:
          KIT_SHA: ${{ inputs.kit-sha }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN GH_TOKEN
          fail() { printf 'Implementation identity: %s\n' "$1" >&2; exit 1; }
          [[ "$KIT_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "malformed commit identity"
          [[ "$MB_KIT_TREE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "malformed MB_KIT_TREE_DIGEST literal"
          while IFS= read -r name; do
            [[ "$name" != GIT_* ]] || fail "GIT_* variables must not reach a privileged kit job"
          done < <(compgen -e)
          [[ "$(git -C mod rev-parse HEAD)" == "$GITHUB_SHA" ]] || fail "the mod checkout is not github.sha"
          mod_status="$(git -C mod status --porcelain --untracked-files=all)" ||
            fail "cannot read the mod checkout status"
          [[ -z "$mod_status" ]] || fail "the mod checkout is not clean"
          [[ "$(git -C kit rev-parse HEAD)" == "$KIT_SHA" ]] || fail "the kit checkout is not the verified pin"
          kit_status="$(git -C kit status --porcelain --untracked-files=all)" ||
            fail "cannot read the kit checkout status"
          [[ -z "$kit_status" ]] || fail "the kit checkout is not clean"
          canonical_branch="$(jq -er '.canonical_branch | strings' mod/site/mod-base.json)" ||
            fail "site/mod-base.json names no canonical branch"
          [[ "$canonical_branch" =~ ^[A-Za-z0-9._/-]{1,200}$ && "$canonical_branch" != /* &&
             "$canonical_branch" != *..* && "$canonical_branch" != *//* ]] || fail "malformed canonical branch"
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/mod-base-build.yml@refs/heads/$canonical_branch" ||
             "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/mod-base-packaged-e2e.yml@refs/heads/$canonical_branch" ]] ||
            fail "this job is not called by a managed Build or packaged E2E caller of the canonical branch"
          # >>> kit-digest-v1
          kit_digest_v1() {
            local root="$1" directory offending listing
            for directory in src site requirements; do
              if [[ ! -d "$root/$directory" || -L "$root/$directory" ]]; then
                printf 'kit-digest-v1: %s/ is not a real directory\n' "$directory" >&2
                return 1
              fi
            done
            if ! offending="$(CDPATH='' cd -- "$root" && LC_ALL=C find ./src ./site ./requirements \( -type l \
                -o \( ! -type f ! -type d \) -o \( -type f \( -perm -100 -o -perm -010 -o -perm -001 \) \) \
                -o -name __pycache__ -o -name '*[!A-Za-z0-9._-]*' \) -print -quit)" || [[ -n "$offending" ]]; then
              printf 'kit-digest-v1: refusing %q (symlink, special file, executable, __pycache__ or unsafe name)\n' \
                "$offending" >&2
              return 1
            fi
            if ! listing="$(CDPATH='' cd -- "$root" && LC_ALL=C find ./src ./site ./requirements -type f -print0 \
                | LC_ALL=C sort -z | while IFS= read -r -d '' path; do
                    [[ "$path" =~ ^\./[A-Za-z0-9._/-]+$ ]] || exit 1
                    sha256sum -- "$path" || exit 1
                  done)" || [[ -z "$listing" ]]; then
              printf 'kit-digest-v1: cannot list the kit tree\n' >&2
              return 1
            fi
            printf 'sha256:%s\n' "$(printf '%s\n' "$listing" | sha256sum | cut -d ' ' -f 1)"
          }
          # <<< kit-digest-v1
          actual="$(kit_digest_v1 kit)" || fail "the kit checkout cannot be digested"
          [[ "$actual" == "$MB_KIT_TREE_DIGEST" ]] || fail "the kit tree digest $actual differs from the callee literal"
          printf 'MOD_BASE_KIT_SHA=%s\n' "$KIT_SHA" >> "$GITHUB_ENV"
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the hash-locked imaging dependency
        shell: bash
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN GH_TOKEN
          python3 -m pip install --only-binary=:all: --require-hashes --requirement kit/requirements/pillow.txt
      - name: Authenticate the tested subject
        id: subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN
          env -u PYTHONPATH PYTHONPATH="$GITHUB_WORKSPACE/kit/src" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -P -m mod_base ci subject --repo mod --config mod/site/mod-base.json --state "$RUNNER_TEMP/mb-state" \
            --producer packaged --pr "" --github-output "$GITHUB_OUTPUT"
      - name: Fence the host and prepare the worker accounts
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN GH_TOKEN
          interpreter="$(command -v python3)"
          env -u PYTHONPATH PYTHONPATH="$GITHUB_WORKSPACE/kit/src" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -P -m mod_base ci worker-prepare --repo mod --config mod/site/mod-base.json --state "$RUNNER_TEMP/mb-state" \
            --roles validator --python "$interpreter" \
            --java-home "$JAVA_HOME_17_X64" --java-home "$JAVA_HOME_21_X64" --java-home "$JAVA_HOME_25_X64"
      - name: Derive the protected plan
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN
          env -u PYTHONPATH PYTHONPATH="$GITHUB_WORKSPACE/kit/src" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -P -m mod_base ci plan --repo mod --config mod/site/mod-base.json --state "$RUNNER_TEMP/mb-state" \
            --github-output "$GITHUB_OUTPUT"
      - name: Admit post-merge reuse
        id: reuse
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN
          env -u PYTHONPATH PYTHONPATH="$GITHUB_WORKSPACE/kit/src" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -P -m mod_base ci reuse-admit --repo mod --config mod/site/mod-base.json --state "$RUNNER_TEMP/mb-state" \
            --github-output "$GITHUB_OUTPUT"
      - name: Select the exact Build source
        id: select
        if: steps.reuse.outputs.mode != 'reuse'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN
          env -u PYTHONPATH PYTHONPATH="$GITHUB_WORKSPACE/kit/src" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -P -m mod_base ci select-build --repo mod --config mod/site/mod-base.json --state "$RUNNER_TEMP/mb-state" \
            --output "$RUNNER_TEMP/mb-state/build-selection.json" --github-output "$GITHUB_OUTPUT"
      - name: Terminate and lock the worker accounts
        if: ${{ always() && steps.subject.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN GH_TOKEN
          env -u PYTHONPATH PYTHONPATH="$GITHUB_WORKSPACE/kit/src" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -P -m mod_base ci worker-finish --repo mod --config mod/site/mod-base.json --state "$RUNNER_TEMP/mb-state"
