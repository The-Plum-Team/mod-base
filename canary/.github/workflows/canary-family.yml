# Synthetic demonstration evidence — not a product.
# The canary's family producer (families[].producer.workflow of site/mod-base.json): it generates one
# synthetic demo-pairs generation for one key, wraps it in its envelope through the pinned kit's
# publish-family composite and wakes the protected site with a family wake. Every kit reference is a
# placeholder pin that the canary procedure (mod-base docs/OPERATIONS.md) fills in.
name: Canary family

on:
  workflow_dispatch:
    inputs:
      key:
        description: The bundle key of the family generation (empty = the first key)
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: canary-family
  cancel-in-progress: false

jobs:
  family:
    name: Publish synthetic family evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      key: ${{ steps.native.outputs.key }}
      artifact-id: ${{ steps.handoff.outputs.artifact-id }}
      artifact-digest: ${{ steps.handoff.outputs.artifact-digest }}
    steps:
      - name: Check out the canary head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify the pinned kit and install the imaging dependency
        uses: The-Plum-Team/mod-base/actions/setup@{{PIN}} # {{VERSION}}
      - name: Read this producer attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,17}$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/canary-producer-run.json"
      - name: Generate the native family bundle
        id: native
        shell: bash
        env:
          KEY: ${{ inputs.key }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GITHUB_TOKEN GH_TOKEN
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          kit() {
            env -u PYTHONPATH PYTHONPATH="$MOD_BASE_KIT_PATH/src" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
              python3 -P scripts/canary/produce.py "$@"
          }
          if [[ -z "$KEY" ]]; then
            KEY="$(kit keys | jq -er '.[0] | strings')"
          fi
          [[ "$KEY" =~ ^[a-z0-9][a-z0-9._-]{0,62}[a-z0-9]$ && "$KEY" != *--* ]]
          bundle="$RUNNER_TEMP/canary-family"
          kit family --key "$KEY" --run-json "$RUNNER_TEMP/canary-producer-run.json" --output "$bundle"
          printf 'key=%s\nbundle=%s\n' "$KEY" "$bundle" >> "$GITHUB_OUTPUT"
      - name: Upload the mod-base family handoff
        id: handoff
        uses: The-Plum-Team/mod-base/actions/publish-family@{{PIN}} # {{VERSION}}
        with:
          family: demo-pairs
          key: ${{ steps.native.outputs.key }}
          bundle: ${{ steps.native.outputs.bundle }}
          coverage-sha: ${{ github.sha }}
          subject-branch: ${{ github.ref_name }}
          subject-commit: ${{ github.sha }}

  notify-family:
    name: Wake the protected project site for family evidence
    needs: family
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Dispatch the separately locked family publication
        uses: The-Plum-Team/mod-base/actions/notify-pages@{{PIN}} # {{VERSION}}
        with:
          operation: family
          run-id: ${{ github.run_id }}
          sha: ${{ github.sha }}
          family: demo-pairs
          bundle-key: ${{ needs.family.outputs.key }}
          artifact-id: ${{ needs.family.outputs.artifact-id }}
          artifact-digest: ${{ needs.family.outputs.artifact-digest }}
          coverage-sha: ${{ github.sha }}
